<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لَمّة الدار</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f8f4ea,#17201c);--surface:light-dark(#fffdf8,#202a25);--surface2:light-dark(#eef4ef,#26342e);--text:light-dark(#18352d,#f4f1e8);--muted:light-dark(#6a746f,#b8c0bb);--green:light-dark(#1f5a49,#6eb49a);--gold:#c89b3c;--border:light-dark(#e2e4de,#38453f);}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Tahoma",sans-serif;color:var(--text)}#app{min-height:100vh;background:var(--bg)}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 18px}.top{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-weight:800;font-size:24px;color:var(--green)}.brand small{display:block;font-size:11px;color:var(--gold);margin-top:2px}.cart{border:0;background:var(--green);color:white;border-radius:14px;padding:10px 14px;font-weight:700;cursor:pointer}
.hero{max-width:1100px;margin:18px auto;padding:30px 20px;border-radius:24px;background:linear-gradient(135deg,#1f5a49,#315f51);color:white;position:relative;overflow:hidden}.hero:after{content:'🍲  🥘  🍰';position:absolute;left:20px;bottom:15px;font-size:54px;opacity:.18}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;max-width:650px;line-height:1.8;color:#edf4ef}.tabs{max-width:1100px;margin:14px auto;display:flex;gap:8px;overflow:auto;padding:0 2px}.tab{white-space:nowrap;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 14px;border-radius:999px;cursor:pointer}.tab.active{background:var(--green);color:white;border-color:var(--green)}
.grid{max-width:1100px;margin:16px auto 80px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 5px 18px #0000000a}.photo{height:145px;background:linear-gradient(135deg,#f0dfb5,#d8b967);display:flex;align-items:center;justify-content:center;font-size:68px}.body{padding:14px}.body h3{margin:0 0 5px;font-size:18px}.meta{color:var(--muted);font-size:12px}.price{font-weight:800;color:var(--green);font-size:18px;margin:10px 0}.add{width:100%;border:0;background:var(--green);color:#fff;padding:10px;border-radius:12px;font-weight:700;cursor:pointer}.empty{text-align:center;grid-column:1/-1;color:var(--muted);padding:40px}.drawer{position:fixed;inset:0;background:#0008;z-index:30;display:none}.drawer.open{display:block}.panel{position:absolute;right:0;top:0;height:100%;width:min(430px,94vw);background:var(--surface);padding:18px;overflow:auto}.panel h2{margin-top:0}.line{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}.qty{display:flex;align-items:center;gap:7px}.qty button{border:1px solid var(--border);background:var(--surface2);border-radius:8px;width:30px;height:30px;color:var(--text);cursor:pointer}.form input,.form textarea{width:100%;margin:6px 0;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);font:inherit}.primary{width:100%;padding:12px;border:0;border-radius:12px;background:var(--gold);color:white;font-weight:800;cursor:pointer}.close{float:left;border:0;background:transparent;font-size:22px;color:var(--text);cursor:pointer}.admin{max-width:1100px;margin:0 auto 50px;padding:0 10px}.adminbox{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--surface2);padding:15px;border-radius:14px}.stat b{display:block;font-size:21px;color:var(--green);margin-top:4px}.notice{background:#fff4d8;color:#5c4b20;padding:10px;border-radius:10px;font-size:12px;margin-top:10px}@media(max-width:600px){.hero h1{font-size:25px}.stats{grid-template-columns:1fr}.grid{padding:0 10px}.hero{margin:12px 10px}.tabs{padding:0 10px}}
</style></head>
<body><div id="app">
<header><div class="top"><div class="brand">لَمّة الدار<small>بنّة القل في مكان واحد</small></div><button class="cart" onclick="openCart()">🛒 السلة <span id="count">0</span></button></div></header>
<section class="hero"><h1>أكلات من دارنا… لداركم ❤️</h1><p>أكلات وحلويات تقليدية محضّرة في بيوت القل، تجمعها «لَمّة الدار» وتوصلها إليكم بسهولة.</p></section>
<div class="tabs" id="tabs"></div><main class="grid" id="products"></main>
<section class="admin"><div class="adminbox"><h2>لوحة المشروع</h2><div class="stats"><div class="stat">الطلبات<b id="orders">0</b></div><div class="stat">قيمة المبيعات<b id="sales">0 دج</b></div><div class="stat">عدد المنتجات<b id="items">0</b></div></div><div class="notice">المنتجات والأسعار والتوفر اليومي تُدار من قاعدة بيانات لَمّة الدار.</div><div class="form" style="margin-top:14px"><input id="adminEmail" placeholder="بريد الإدارة"><input id="adminPassword" type="password" placeholder="كلمة مرور الإدارة"><button type="button" class="primary" id="adminLoginButton">دخول الإدارة</button></div><div id="adminStatus" class="meta" style="margin:10px 0"></div><div id="adminProducts"></div></div></section>
<div class="drawer" id="drawer" onclick="if(event.target===this)closeCart()"><div class="panel"><button class="close" onclick="closeCart()">×</button><h2>سلة الطلب</h2><div id="cartLines"></div><div class="form"><input id="name" placeholder="اسم الزبون"><input id="phone" placeholder="رقم الهاتف"><textarea id="address" rows="3" placeholder="العنوان / ملاحظات التوصيل"></textarea></div><h3>الإجمالي: <span id="total">0 دج</span></h3><button class="primary" onclick="placeOrder()">تأكيد الطلب</button></div></div>
<script src="supabase.js"></script>
<script>
let supabase=null;if(window.supabase&&window.supabase.createClient){supabase=window.supabase.createClient('https://kmlqtpzatkhicpaogckx.supabase.co','sb_publishable_rmsuIh8p9JTtAiSm83yytA_1oAF0jLx');}
let products=[],cat='الكل',cart={},orders=0,sales=0;
const emojiByCat={'مالح':'🥞','خبز تقليدي':'🫓','أطباق تقليدية':'🍲','حلويات':'🍰'};
async function loadProducts(){if(!supabase){const st=document.getElementById('adminStatus');if(st)st.textContent='تعذر تحميل مكتبة الاتصال. تحقق من الإنترنت ثم أعد فتح التطبيق.';return}const {data,error}=await supabase.from('products').select('id,code,name,category,sale_price,active,available_today').order('code');if(error){console.error(error);alert('تعذر تحميل المنتجات.');return}products=(data||[]).map(p=>({id:p.id,code:p.code,name:p.name,cat:p.category,price:Number(p.sale_price),emoji:emojiByCat[p.category]||'🍽️',active:p.active,available:p.available_today}));render();loadAdminProducts()}
function renderTabs(){const cats=['الكل',...new Set(products.filter(x=>x.active&&x.available).map(x=>x.cat))];if(!cats.includes(cat))cat='الكل';document.getElementById('tabs').innerHTML=cats.map(c=>`<button class="tab ${c===cat?'active':''}" onclick="cat='${c}';render()">${c}</button>`).join('')}
function render(){renderTabs();let list=cat==='الكل'?products.filter(x=>x.active&&x.available):products.filter(x=>x.active&&x.available&&x.cat===cat);document.getElementById('products').innerHTML=list.length?list.map(p=>`<article class="card"><div class="photo">${p.emoji}</div><div class="body"><h3>${p.name}</h3><div class="meta">${p.cat} • متوفر اليوم</div><div class="price">${p.price} دج</div><button class="add" onclick="add('${p.id}')">أضف إلى السلة</button></div></article>`).join(''):'<div class="empty">لا توجد منتجات متوفرة اليوم في هذا القسم.</div>';document.getElementById('items').textContent=products.filter(x=>x.active&&x.available).length;document.getElementById('orders').textContent=orders;document.getElementById('sales').textContent=sales+' دج'}
function add(id){cart[id]=(cart[id]||0)+1;renderCart();openCart()}function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderCart()}
function renderCart(){let entries=Object.entries(cart);let total=0;document.getElementById('cartLines').innerHTML=entries.length?entries.map(([id,q])=>{let p=products.find(x=>x.id===id);if(!p||!p.active||!p.available)return '';let sum=p.price*q;total+=sum;return `<div class="line"><div><b>${p.name}</b><div class="meta">${sum} دج</div></div><div class="qty"><button onclick="change('${id}',-1)">−</button><b>${q}</b><button onclick="change('${id}',1)">+</button></div></div>`}).join(''):'<p class="meta">السلة فارغة.</p>';document.getElementById('total').textContent=total+' دج';document.getElementById('count').textContent=entries.reduce((a,[,q])=>a+q,0)}
function openCart(){document.getElementById('drawer').classList.add('open');renderCart()}function closeCart(){document.getElementById('drawer').classList.remove('open')}
async function placeOrder(){let entries=Object.entries(cart);if(!entries.length)return alert('أضف منتجاً أولاً.');let n=document.getElementById('name').value.trim(),ph=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim();if(!n||!ph)return alert('أدخل الاسم ورقم الهاتف.');let valid=entries.map(([id,q])=>({id,q})).filter(x=>products.some(p=>p.id===x.id&&p.active&&p.available));if(!valid.length)return alert('المنتجات المختارة غير متوفرة اليوم.');let total=valid.reduce((s,x)=>s+products.find(p=>p.id===x.id).price*x.q,0);const {data:order,error}=await supabase.from('orders').insert({customer_name:n,customer_phone:ph,customer_address:address,status:'new',total_amount:total}).select('id,order_number').single();if(error){alert('تعذر تسجيل الطلب: '+error.message);return}const rows=valid.map(x=>{let p=products.find(p=>p.id===x.id);return {order_id:order.id,product_id:p.id,producer_id:null,quantity:x.q,sale_price:p.price,producer_price:0}});const {error:itemError}=await supabase.from('order_items').insert(rows);if(itemError){alert('تم إنشاء الطلب لكن تعذر حفظ تفاصيله.');return}alert('تم تسجيل طلبك رقم '+order.order_number+' بنجاح. سنتواصل معك لتأكيده.');cart={};document.getElementById('name').value='';document.getElementById('phone').value='';document.getElementById('address').value='';closeCart();renderCart();loadProducts()}
async function adminLogin(){const status=document.getElementById('adminStatus');try{status.textContent='جارٍ تسجيل الدخول...';if(!window.supabase||!window.supabase.createClient){status.textContent='مكتبة الاتصال لم تُحمّل. تحقق من الإنترنت.';return}const email=document.getElementById('adminEmail').value.trim(),password=document.getElementById('adminPassword').value;if(!email||!password){status.textContent='أدخل البريد وكلمة المرور.';return}const {error}=await supabase.auth.signInWithPassword({email,password});if(error){status.textContent='فشل الدخول: '+error.message;return}status.textContent='تم تسجيل الدخول بنجاح.';await loadAdminProducts()}catch(e){status.textContent='حدث خطأ: '+(e.message||String(e))}}
document.getElementById('adminLoginButton').addEventListener('click',adminLogin);
async function loadAdminProducts(){const {data,error}=await supabase.from('products').select('id,code,name,category,sale_price,active,available_today').order('code');if(error){document.getElementById('adminProducts').innerHTML='<div class="notice">سجّل دخول الإدارة لعرض لوحة الأسعار والتوفر.</div>';return}document.getElementById('adminProducts').innerHTML='<h3>الأسعار والتوفر اليومي</h3>'+data.map(p=>`<div class="line" style="align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:130px"><b>${p.name}</b><div class="meta">${p.code} • ${p.category}</div></div><input id="price-${p.id}" type="number" min="0" value="${p.sale_price}" style="width:90px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text)"><label style="font-size:12px"><input id="avail-${p.id}" type="checkbox" ${p.available_today?'checked':''}> متوفر اليوم</label><label style="font-size:12px"><input id="active-${p.id}" type="checkbox" ${p.active?'checked':''}> فعال</label><button class="tab" onclick="saveProduct('${p.id}')">حفظ</button></div>`).join('')}
async function saveProduct(id){const price=Number(document.getElementById('price-'+id).value),available=document.getElementById('avail-'+id).checked,active=document.getElementById('active-'+id).checked;const {error}=await supabase.from('products').update({sale_price:price,available_today:available,active}).eq('id',id);if(error){alert('تعذر الحفظ: '+error.message);return}alert('تم حفظ السعر والتوفر.');await loadProducts()}
supabase.auth.onAuthStateChange(()=>loadAdminProducts());loadProducts();
</script></div></body></html>
